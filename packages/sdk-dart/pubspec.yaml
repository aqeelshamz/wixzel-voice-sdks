name: wixzel_voice
description: Official Dart SDK for the Wixzel Voice API. Build AI agents that place and answer real phone calls over your own SIP trunk, from Dart and Flutter.
version: 0.4.0
repository: https://github.com/aqeelshamz/wixzel-voice-sdks
homepage: https://voice.wixzel.com
documentation: https://docs.voice.wixzel.com/sdks
issue_tracker: https://github.com/aqeelshamz/wixzel-voice-sdks/issues
topics:
  - voice-ai
  - telephony
  - flutter
  - sip
  - ai-agents

environment:
  sdk: ^3.5.0

dependencies:
  http: ^1.2.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0

# The npm-workspace shim is repo plumbing, not part of the package.
false_secrets:
  - /package.json
